[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openbench-radar"
version = "0.1.0"
description = "Automated retrieval, research and reporting agent for open AI/LLM benchmarks."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "OpenBench Radar contributors" }]
keywords = ["llm", "benchmark", "evaluation", "research", "agent", "arxiv", "huggingface"]
dependencies = [
    "requests>=2.31.0",
    "PyYAML>=6.0",
    "feedparser>=6.0.10",
    "python-dateutil>=2.8.2",
]

[project.optional-dependencies]
llm = ["openai>=1.30.0"]
dev = ["pytest>=7.0"]

[project.scripts]
openbench-agent = "openbench_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
