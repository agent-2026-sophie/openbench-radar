name: Benchmark Research

# Runs the OpenBench Radar pipeline on a schedule, commits new reports,
# and publishes the HTML digest to GitHub Pages.

on:
  schedule:
    # Daily at 08:00 UTC. Adjust to your needs (cron is UTC).
    - cron: "0 8 * * *"
  workflow_dispatch:        # allow manual runs from the Actions tab
    inputs:
      topics:
        description: "Optional comma-separated topics override"
        required: false
        default: ""

permissions:
  contents: write           # to commit generated reports
  pages: write              # to deploy to GitHub Pages
  id-token: write

concurrency:
  group: benchmark-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e .[llm]

      - name: Run pipeline
        env:
          # ARK model (OpenAI-compatible). Only the API key is a secret;
          # add it under repo Settings → Secrets and variables → Actions as ARK_API_KEY.
          # base_url & model are non-sensitive and set inline here.
          OPENAI_API_KEY: ${{ secrets.ARK_API_KEY }}
          OPENAI_BASE_URL: http://ark-cn-beijing.bytedance.net/api/v3
          OPENAI_MODEL: ep-20260623142718-7q245
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          EXTRA=""
          if [ -n "${{ github.event.inputs.topics }}" ]; then
            EXTRA="--topics \"${{ github.event.inputs.topics }}\""
          fi
          eval openbench-agent run --format both $EXTRA

      - name: Commit reports
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No report changes."
          else
            git commit -m "chore: benchmark digest $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble site (app + reports)
        run: |
          mkdir -p _site
          cp -r web/* _site/                 # interactive app -> landing page (index.html)
          mkdir -p _site/reports
          cp -r reports/* _site/reports/ 2>/dev/null || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: research
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
